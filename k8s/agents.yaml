apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-agents-sa
  namespace: argo-rollouts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-agents-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/proxy", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-orchestrator-sa
  namespace: argo-rollouts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-orchestrator-role
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-orchestrator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-orchestrator-role
subjects:
  - kind: ServiceAccount
    name: kubernetes-orchestrator-sa
    namespace: argo-rollouts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-agents-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-agents-role
subjects:
  - kind: ServiceAccount
    name: kubernetes-agents-sa
    namespace: argo-rollouts
  - kind: ServiceAccount
    name: kubernetes-orchestrator-sa
    namespace: argo-rollouts
---
# -----------------------------------------------------------------------------
# Log Analyst Service & Deployment
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-agent-logs
  namespace: argo-rollouts
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: kubernetes-agent-logs
---
# -----------------------------------------------------------------------------
# Log Proxy Service & Deployment
#
# The Log Analyst agent runs in a gVisor Sandbox, which by cluster security
# policy (secure-sandbox-policy) cannot mount a service account token and has
# no direct K8s API access. This trusted, non-sandboxed service holds the
# service account and fetches pod logs on its behalf over HTTP.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-agent-log-proxy
  namespace: argo-rollouts
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: kubernetes-agent-log-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent-log-proxy
  namespace: argo-rollouts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-agent-log-proxy
  template:
    metadata:
      labels:
        app: kubernetes-agent-log-proxy
    spec:
      serviceAccountName: kubernetes-agents-sa
      containers:
        - name: agent
          image: kubernetes-agents-antigravity:latest
          imagePullPolicy: Always
          args: ["--role", "log-proxy"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
# -----------------------------------------------------------------------------
# Metrics Analyst Service & Deployment
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-agent-metrics
  namespace: argo-rollouts
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: kubernetes-agent-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent-metrics
  namespace: argo-rollouts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-agent-metrics
  template:
    metadata:
      labels:
        app: kubernetes-agent-metrics
    spec:
      serviceAccountName: kubernetes-agents-sa
      containers:
        - name: agent
          image: kubernetes-agents-antigravity:latest
          imagePullPolicy: Always
          args: ["--role", "metrics"]
          env:
            - name: ANALYSIS_MIN_CANARY_REQUESTS
              value: "500"
            - name: ANALYSIS_SAMPLE_WINDOW_SECONDS
              value: "10"
            - name: ANALYSIS_MAX_SAMPLE_WAITS
              value: "3"
            - name: APPLICATION_METRICS_PORT
              value: "8080"
            - name: APPLICATION_METRICS_PATH
              value: "/q/metrics"
          ports:
            - containerPort: 8080
---
# -----------------------------------------------------------------------------
# Event Analyst Service & Deployment
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-agent-events
  namespace: argo-rollouts
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: kubernetes-agent-events
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent-events
  namespace: argo-rollouts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-agent-events
  template:
    metadata:
      labels:
        app: kubernetes-agent-events
    spec:
      serviceAccountName: kubernetes-agents-sa
      containers:
        - name: agent
          image: kubernetes-agents-antigravity:latest
          imagePullPolicy: Always
          args: ["--role", "events"]
          ports:
            - containerPort: 8080
---
# -----------------------------------------------------------------------------
# Lead Orchestrator Service & Deployment (Exposed gateway)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-agent-orchestrator
  namespace: argo-rollouts
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: kubernetes-agent-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent-orchestrator
  namespace: argo-rollouts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-agent-orchestrator
  template:
    metadata:
      labels:
        app: kubernetes-agent-orchestrator
    spec:
      serviceAccountName: kubernetes-orchestrator-sa
      containers:
        - name: agent
          image: kubernetes-agents-antigravity:latest
          imagePullPolicy: Always
          args: ["--role", "orchestrator"]
          env:
            - name: ANALYSIS_MODEL
              value: gemini-4-hydrogen
            - name: ANALYSIS_THINKING_LEVEL
              value: high
            # Empty by default; set gemini-4-argon to enable escalation.
            - name: ANALYSIS_SECOND_OPINION_MODEL
              value: ""
            - name: DECISION_AGENT_MODEL
              value: gemini-decision-1
            - name: DECISION_GRADING_MODE
              value: shadow
            # A2A JSON-RPC endpoint; model and GitHub credentials live in that service.
            - name: REMEDIATION_AGENT_URL
              value: ""
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: argo-rollouts-secret
                  key: GEMINI_API_KEY
            - name: LOGS_AGENT_URL
              value: "http://kubernetes-agent-logs.argo-rollouts.svc.cluster.local:8080"
            - name: METRICS_AGENT_URL
              value: "http://kubernetes-agent-metrics.argo-rollouts.svc.cluster.local:8080"
            - name: EVENTS_AGENT_URL
              value: "http://kubernetes-agent-events.argo-rollouts.svc.cluster.local:8080"
          ports:
            - containerPort: 8080
